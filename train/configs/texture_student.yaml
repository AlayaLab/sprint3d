# Texture student: trajectory distillation of Pixal3D's texture flow (k = 2 steps).
# Run:  python train/texture_traj/train.py --config train/configs/texture_student.yaml
# The values below are those of the second training segment of the released student (updates
# 1,501-3,000; docs/TRAINING.md describes both segments). Set the paths marked "set me" first.
# Relative paths are resolved against the directory of this file.

model:
  pixal3d: null                 # Pixal3D weights: local directory or Hugging Face repository id
  pixal3d_src: null             # Pixal3D source checkout (null: $FASTPIXAL3D_PIXAL3D_SRC, else third_party/Pixal3D)
  base_submodel: ckpts/slat_flow_imgshape2tex_dit_1_3B_1024_bf16
  gradient_checkpointing: true

lora:
  rank: 256
  alpha: 256.0
  dropout: 0.0

schedule:
  teacher_steps: 12
  rescale_t: 3.0
  grid_indices: [0, 6, 12]      # student grid t = 1.0, 0.75, 0.0 (k = 2)

data:
  anchors: /path/to/cache/texture_anchors_10k               # set me (train/caches/texture_anchors.py)
  image_roots: [/path/to/curated_10k]                       # set me: <root>/<subset dir>/renders_cond/<sha256>/NNN.png
  views: ../../data/lists/curated_10k.csv                   # 10,000 objects x 2 views (19,998 views have records)
  view_key: sha256
  view_indices: [0, 1]
  max_views: null
  name: curated_10k

optim:
  updates: 3000
  grad_accum: 4                 # 1 process x 4 micro-batches per update (the first segment: 4 processes x 1)
  lr: 1.0e-4
  betas: [0.9, 0.999]
  weight_decay: 0.0
  grad_clip: 10.0
  ema_decay: 0.99
  seed: 20260912
  autocast: bfloat16

output:
  dir: /path/to/runs/texture_student                       # set me
  checkpoint_every: 250         # the first segment used 500
  log_every: 10
  resume: auto                  # the second segment resumed from completed_updates_000000001500.pt

runtime:
  device: cuda
  tf32_override: true
  threads: 4
  max_minutes: null
