[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastpixal3d"
version = "0.1.0"
description = "Fast single-image to textured-mesh inference built on Pixal3D"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md"]
authors = [{ name = "Alaya Lab" }]
requires-python = ">=3.10,<3.11"
# Versions of the measured environment (docs/INSTALL.md). Packages built from source
# (CUDA extensions, FlashAttention) are listed in docs/INSTALL.md and are not resolved by pip here:
#   FlexGEMM      github.com/JeffreyXiang/FlexGEMM     @ 6dd94a859c26ee8246888502eada3dd8ad85532e  (flex_gemm 1.0.0)
#   CuMesh        github.com/JeffreyXiang/CuMesh       @ 12289e1062f0603f2f0d0771b02e1395d247f26f  (cumesh 0.0.1, stock)
#   o-voxel       github.com/microsoft/TRELLIS.2       @ de38fdd4082638cb4e6d2285f2e215280bd3f485  (o-voxel/, o_voxel 0.0.1)
#   nvdiffrast    github.com/NVlabs/nvdiffrast         @ 253ac4fcea7de5f396371124af597e6cc957bfae  (0.4.0)
#   MoGe          github.com/microsoft/MoGe            @ 07444410f1e33f402353b99d6ccd26bd31e469e8  (moge 2.0.0)
#   pipeline      github.com/EasternJournalist/pipeline @ 866f059d2a05cde05e4a52211ec5051fd5f276d6
#   utils3d       github.com/EasternJournalist/utils3d @ 9a4eb15e4021b67b12c460c7057d642626897ec8  (0.0.2)
#                 + env/patches/utils3d-moge2-compat.patch
#   FlashAttention-2  flash_attn==2.8.3
#   FlashAttention-3  github.com/Dao-AILab/flash-attention v2.8.3.post1 @ a8aa52b, hopper/ (sm_90 only)
#   natten        0.21.0 (build matching torch 2.7.0 / CUDA 12.8)
#   patched cumesh / cubvh: native/build_native.sh
dependencies = [
    "torch==2.7.0",
    "torchvision==0.22.0",
    "triton==3.3.0",
    "numpy==2.2.6",
    "scipy==1.15.3",
    "Pillow==12.2.0",
    "opencv-python-headless==4.13.0.92",
    "trimesh==4.12.2",
    "transformers==4.57.3",
    "timm==1.0.27",
    "safetensors==0.7.0",
    "huggingface_hub==0.36.2",
    "easydict==1.13",
    "tqdm==4.67.3",
    "pyyaml==6.0.3",
    "imageio==2.37.3",
    "imageio-ffmpeg==0.6.0",
    "zstandard==0.25.0",
    "kornia==0.8.2",
    "diffusers==0.37.1",
    "accelerate==1.13.0",
    "plyfile==1.1.3",
    "fpng==0.1.0",
    "lazy_loader==0.4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA GPU, the weights and the native extensions (skipped otherwise)",
]
